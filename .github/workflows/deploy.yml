name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'k8s/**' # Don't trigger if only K8s files change to prevent infinite loops

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t shahabdullah04/flipkart-backend:${{ github.sha }} -f Dockerfile.backend .
          docker push shahabdullah04/flipkart-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          cd frontend
          docker build -t shahabdullah04/flipkart-frontend:${{ github.sha }} .
          docker push shahabdullah04/flipkart-frontend:${{ github.sha }}

      - name: Update Kubernetes Manifests
        run: |
          # Replace the old image tags with the new commit SHA
          sed -i "s|image: shahabdullah04/flipkart-backend:.*|image: shahabdullah04/flipkart-backend:${{ github.sha }}|g" k8s/backend.yaml
          sed -i "s|image: shahabdullah04/flipkart-frontend:.*|image: shahabdullah04/flipkart-frontend:${{ github.sha }}|g" k8s/frontend.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "Auto-update image tags to ${{ github.sha }}"
          git push