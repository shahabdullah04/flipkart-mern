---
- name: Configure EC2 Node and Initialize Kubernetes Cluster
  hosts: ec2_nodes
  become: yes 
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Install Microk8s via Snap
      snap:
        name: microk8s
        classic: yes
        state: present

    - name: Add ubuntu user to microk8s group
      user:
        name: ubuntu
        groups: microk8s
        append: yes

    # --- ADD THIS NEW TASK ---
    - name: Refresh SSH connection to load new group permissions
      meta: reset_connection
    # -------------------------

    - name: Create .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Wait for Microk8s to be ready
      command: microk8s status --wait-ready
      changed_when: false
      become: no

    - name: Enable essential Microk8s addons
      command: microk8s enable dns storage ingress
      register: addon_output
      changed_when: "'Enabling' in addon_output.stdout"