services:
  database:
    image: shahabdullah04/flipkart-database:latest
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: flipkart-database
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    image: shahabdullah04/flipkart-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flipkart-backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://database:27017/flipkart-mern
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      COOKIE_EXPIRE: ${COOKIE_EXPIRE:-5}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SERVICE: ${SMTP_SERVICE:-}
      SMTP_MAIL: ${SMTP_MAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_MAIL: ${SENDGRID_MAIL:-}
      SENDGRID_RESET_TEMPLATEID: ${SENDGRID_RESET_TEMPLATEID:-}
      SENDGRID_ORDER_TEMPLATEID: ${SENDGRID_ORDER_TEMPLATEID:-}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYTM_MID: ${PAYTM_MID:-}
      PAYTM_MERCHANT_KEY: ${PAYTM_MERCHANT_KEY:-}
      PAYTM_WEBSITE: ${PAYTM_WEBSITE:-WEBSTAGING}
      PAYTM_CHANNEL_ID: ${PAYTM_CHANNEL_ID:-WEB}
      PAYTM_INDUSTRY_TYPE: ${PAYTM_INDUSTRY_TYPE:-Retail}
      PAYTM_CUST_ID: ${PAYTM_CUST_ID:-}
    ports:
      - "4000:4000"

  frontend:
    image: shahabdullah04/flipkart-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: flipkart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongodb_data:
